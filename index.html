<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秋招投递管理</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--line:#e6e4dd;--line2:#d2d0c7;--hov:#faf9f6;
  --txt:#2b2a26;--txt2:#5f5d55;--txt3:#918f85;
  --gr:#4a6741;--gr2:#5d7d52;--grbg:#eef2ea;
  --bl:#3b6ea5;--blbg:#eaf1f8;
  --or:#c8862a;--orbg:#fdf4e3;
  --rd:#a83c3c;--rdbg:#fbeceb;
  --gy:#8a8880;--gybg:#f1f0ec;
  --pu:#6b5b95;--pubg:#f0edf6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:50px;
}
.hd{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;
  display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:40}
.lg{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.lg span{font-size:11.5px;font-weight:400;color:var(--txt3);margin-left:7px}
.hd .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.bt{padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;
  border:1px solid var(--line2);border-radius:7px;background:var(--card);
  color:var(--txt2);white-space:nowrap;transition:.12s}
.bt:hover{border-color:var(--gr);color:var(--gr)}
.bt.pri{background:var(--gr);border-color:var(--gr);color:#fff}
.bt.pri:hover{background:var(--gr2);color:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;
  border:0;background:var(--card);color:var(--txt2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gr);color:#fff}
.urg{background:#fdf4e3;border-bottom:1px solid #f0e0be;padding:7px 20px;
  font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.urg .lb{color:var(--or);font-weight:600;flex-shrink:0}
.urg .it{background:#fff;border:1px solid #ecd9ae;border-radius:5px;padding:2px 8px;
  color:#8a5a12;cursor:pointer}
.urg .it:hover{border-color:var(--or)}
.urg .it b{font-weight:600}
.main{padding:15px 20px;max-width:1900px;margin:0 auto}
.ov{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:15px 18px;margin-bottom:14px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.kpi{display:flex;gap:20px;flex-shrink:0}
.kp{min-width:56px}
.kp .n{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.kp .l{font-size:10.5px;color:var(--txt3)}
.kp.g .n{color:var(--gr)}.kp.r .n{color:var(--rd)}
.byc{display:flex;gap:9px;flex:1;min-width:260px;flex-wrap:wrap}
.cc{flex:1;min-width:78px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;transition:.12s}
.cc:hover{border-color:var(--txt3)}
.cc.on{border-width:1.5px}
.cc .cn{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.cc .cn i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cc .cv{font-size:19px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.cc .cs{font-size:10px;color:var(--txt3)}
.fn{flex-shrink:0;min-width:200px}
.fn .ttl{font-size:11px;color:var(--txt3);margin-bottom:6px}
.fr{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}
.fr .fl{width:52px;color:var(--txt2);flex-shrink:0;text-align:right}
.fr .fb{flex:1;height:6px;background:#eceae4;border-radius:3px;overflow:hidden}
.fr .fb i{display:block;height:100%;border-radius:3px}
.fr .fv{width:14px;text-align:right;color:var(--txt2)}
.tbw{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.tbs{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1160px}
thead th{
  background:#f2f1ec;border-bottom:1px solid var(--line2);padding:9px 10px;
  text-align:left;font-weight:600;font-size:11.5px;color:var(--txt2);
  white-space:nowrap;position:sticky;top:0;z-index:5;cursor:pointer;user-select:none;
}
thead th:hover{background:#eceae3}
thead th.na{cursor:default}
thead th.na:hover{background:#f2f1ec}
thead th .ar{color:var(--gr);margin-left:2px;font-size:10px}
tbody td{border-bottom:1px solid #f0efea;padding:8px 10px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--hov)}
tbody tr.hot{background:#fdf5f4}
tbody tr.hot:hover{background:#fbeeed}
tbody tr.dim td{opacity:.5}
.gh td{background:#f7f6f2;font-weight:600;font-size:11.5px;color:var(--txt2);
  padding:6px 10px;cursor:default}
.gh td:hover{background:#f7f6f2}
.gh .gi{display:flex;align-items:center;gap:6px}
.gh .gi i{width:8px;height:8px;border-radius:50%}
.gh .gn{color:var(--txt3);font-weight:400}
.co{font-weight:600;font-size:13px}
.po{color:var(--txt2)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:500;white-space:nowrap;display:inline-block}
.t-fin{background:var(--blbg);color:#2c557f}
.t-soe{background:var(--rdbg);color:#8c3232}
.t-net{background:var(--grbg);color:var(--gr)}
.t-oth{background:var(--gybg);color:var(--txt2)}
.st{font-size:10.5px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.s-applied{background:var(--gybg);color:var(--txt2)}
.s-written{background:var(--blbg);color:#2c557f}
.s-interview{background:var(--orbg);color:#8a5a12}
.s-offer{background:var(--grbg);color:var(--gr)}
.s-rejected{background:#f4f3f0;color:#a6a49c;text-decoration:line-through}
.s-gaveup{background:var(--pubg);color:var(--pu)}
.pr{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px}
.p-high{background:#fbeceb;color:var(--rd)}
.p-mid{background:var(--orbg);color:#8a5a12}
.p-low{background:var(--gybg);color:var(--txt2)}
.dl{font-size:11.5px;white-space:nowrap}
.dl.h{color:var(--rd);font-weight:600}
.dl.w{color:var(--or)}
.dl.p{color:var(--txt3);text-decoration:line-through}
.dt{font-size:11.5px;color:var(--txt2);white-space:nowrap}
.lk{color:var(--bl);text-decoration:none;font-size:11.5px}
.lk:hover{text-decoration:underline}
.nt{font-size:11px;color:var(--txt3);max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:block}
.ops{display:flex;gap:3px;opacity:0;transition:.1s}
tr:hover .ops{opacity:1}
.ic{width:21px;height:21px;border-radius:4px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:10px;color:var(--txt3);
  display:inline-flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.ic:hover{border-color:var(--gr);color:var(--gr)}
.ic.d:hover{border-color:var(--rd);color:var(--rd);background:var(--rdbg)}
.sel{font-size:11.5px;font-family:inherit;border:1px solid transparent;
  background:transparent;border-radius:4px;padding:1px 3px;cursor:pointer;color:inherit;max-width:88px}
.sel:hover{border-color:var(--line2);background:var(--card)}
.bd{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.col{flex:1;min-width:208px;background:rgba(255,255,255,.5);
  border:1px solid var(--line);border-radius:10px;transition:.12s}
.col.over{background:var(--grbg);border-color:var(--gr)}
.ch{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:7px;font-size:12.5px;font-weight:600;border-radius:10px 10px 0 0}
.ch .cnt{margin-left:auto;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.06);
  color:var(--txt2);padding:0 5px}
.col[data-s=applied] .ch{background:#f7f7f4}
.col[data-s=written] .ch{background:var(--blbg);color:#2c557f}
.col[data-s=interview] .ch{background:var(--orbg);color:#8a5a12}
.col[data-s=offer] .ch{background:var(--grbg);color:var(--gr)}
.col[data-s=rejected] .ch{background:var(--gybg);color:var(--txt2)}
.col[data-s=gaveup] .ch{background:var(--pubg);color:var(--pu)}
.cb{padding:8px;min-height:66px;display:flex;flex-direction:column;gap:7px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;cursor:grab;position:relative;transition:.12s}
.cd:hover{border-color:var(--line2);box-shadow:0 2px 7px rgba(0,0,0,.06)}
.cd.dragging{opacity:.36}
.cd.hot{background:#fdf0ef;border-color:#f0c9c6}
.cd .cdc{font-size:12.5px;font-weight:600;padding-right:44px}
.cd .cdp{font-size:11.5px;color:var(--txt2);font-style:italic}
.cd .cdm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.cd .ops{position:absolute;top:7px;right:7px}
.ept{font-size:11px;color:var(--txt3);text-align:center;padding:14px 6px;line-height:1.7}
.mask{position:fixed;inset:0;background:rgba(30,29,26,.42);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.dlg{background:var(--card);border-radius:13px;padding:20px 22px;width:100%;max-width:540px;
  box-shadow:0 12px 40px rgba(0,0,0,.2)}
.dlg h3{font-size:15.5px;font-weight:600;margin-bottom:14px}
.fg{margin-bottom:11px}
.fg2{display:flex;gap:10px}
.fg3{display:flex;gap:10px}
.fg2>div,.fg3>div{flex:1}
.fg label{font-size:11px;color:var(--txt2);display:block;margin-bottom:3px}
.fg label i{color:var(--rd);font-style:normal}
.fg input,.fg select,.fg textarea{width:100%;font-family:inherit;font-size:12.5px;
  color:var(--txt);background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 10px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gr);background:var(--card)}
.fg textarea{min-height:56px;resize:vertical}
.dlg .row{display:flex;gap:7px;margin-top:15px;align-items:center}
.dlg .hint{font-size:10.5px;color:var(--txt3);margin-left:auto}
.err{font-size:11px;color:var(--rd);margin-top:4px;display:none}
.err.on{display:block}
.tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);
  background:var(--gr);color:#fff;padding:9px 20px;border-radius:20px;font-size:12.5px;
  font-weight:500;opacity:0;transition:.18s;pointer-events:none;z-index:99;max-width:80vw}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.w{background:var(--or)}
.hide{display:none!important}
.non{padding:36px;text-align:center;color:var(--txt3);font-size:12.5px}
.fbar{display:flex;gap:7px;margin-bottom:11px;align-items:center;flex-wrap:wrap}
.sch{padding:7px 12px;font-size:12.5px;font-family:inherit;border:1px solid var(--line2);
  border-radius:7px;background:var(--card);color:var(--txt);min-width:170px;flex:1;max-width:280px}
.sch:focus{outline:none;border-color:var(--gr)}
.chip{padding:5px 11px;font-size:11.5px;font-family:inherit;cursor:pointer;
  border:1px solid var(--line2);border-radius:14px;background:var(--card);color:var(--txt2)}
.chip:hover{border-color:var(--gr)}
.chip.on{background:var(--gr);border-color:var(--gr);color:#fff}
@media(max-width:820px){
  .main{padding:12px}.hd{padding:10px 13px;flex-wrap:wrap}
  .kpi{gap:14px}.kp .n{font-size:20px}
  .fn{display:none}
  .bd{flex-direction:column}.col{min-width:0;width:100%}
  .ops{opacity:1}
}
</style>
</head>
<body>

<div class="hd">
  <div class="lg">秋招投递管理<span id="cntTip"></span></div>
  <div class="sp">
    <div class="seg">
      <button id="vTable" class="on">表格</button>
      <button id="vBoard">看板</button>
    </div>
    <button class="bt" id="bExp">导出</button>
    <button class="bt" id="bImp">导入</button>
    <button class="bt pri" id="bNew">+ 新增投递</button>
  </div>
</div>

<div class="urg hide" id="urg"></div>

<div class="main">
  <div class="ov">
    <div class="kpi" id="kpi"></div>
    <div class="byc" id="byc"></div>
    <div class="fn">
      <div class="ttl">申请漏斗</div>
      <div id="fnl"></div>
    </div>
  </div>

  <div class="fbar">
    <input class="sch" id="q" placeholder="搜索公司 / 岗位 / 备注…" autocomplete="off">
    <select class="sch" id="qSt" style="max-width:150px;flex:none">
      <option value="">全部状态</option>
      <option value="applied">已投递</option>
      <option value="written">笔试中</option>
      <option value="interview">面试中</option>
      <option value="offer">已 Offer</option>
      <option value="rejected">已挂</option>
      <option value="gaveup">放弃</option>
    </select>
    <button class="chip" data-f="all">全部</button>
    <button class="chip" data-f="live">进行中</button>
    <button class="chip" data-f="urgent">7日内截止</button>
    <button class="chip" data-f="offer">已 Offer</button>
  </div>

  <div id="view"></div>
</div>

<div class="tst" id="tst"></div>
<input type="file" id="fImp" accept=".json" hidden>

<script>
(function(){
  var KEY='autumnJobs_v2';
  var CATS=[
    {k:'finance', n:'金融',c:'#3b6ea5', cls:'t-fin'},
    {k:'soe',     n:'国央企', c:'#a83c3c', cls:'t-soe'},
    {k:'internet',n:'互联网', c:'#4a6741', cls:'t-net'},
    {k:'other',   n:'其他',   c:'#8a8880', cls:'t-oth'}
  ];
  var STS=[
    {k:'applied',  n:'已投递', c:'#8a8880'},
    {k:'written',  n:'笔试中', c:'#3b6ea5'},
    {k:'interview',n:'面试中', c:'#c8862a'},
    {k:'offer',    n:'已 Offer', c:'#4a6741'},
    {k:'rejected', n:'已挂',c:'#b0aea6'},
    {k:'gaveup',   n:'放弃',   c:'#6b5b95'}
  ];
  var PRS=[{k:'high',n:'P1'},{k:'mid',n:'P2'},{k:'low',n:'P3'}];
  var PW={high:3,mid:2,low:1};
  var DEAD={rejected:1,gaveup:1};

  function iso(o){var d=new Date();d.setDate(d.getDate()+(o||0));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d}
  function ds(s){if(!s)return null;var d=new Date(s);d.setHours(0,0,0,0);return Math.round((d-today())/86400000)}
  function fmt(s){if(!s)return '—';var p=s.split('-');return p.length===3?p[0].slice(2)+'/'+p[1]+'/'+p[2]:s}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function nm(arr,k){var f=arr.filter(function(x){return x.k===k})[0];return f?f.n:k}

  var SEED=[
    {id:'f1',company:'某某人寿 浙江分公司',position:'寿险Java 开发/管培',link:'',cat:'finance',
     status:'interview',applyDate:iso(-19),deadline:iso(1),priority:'mid',city:'杭州',note:'面试完成，等结果'},
    {id:'f2',company:'某某财通证券',position:'系统运维 / 信息安全岗',link:'',cat:'finance',
     status:'applied',applyDate:iso(-16),deadline:iso(6),priority:'mid',city:'杭州',note:''},
    {id:'f3',company:'某某银行 浙江省分行',position:'金融科技岗',link:'',cat:'finance',
     status:'written',applyDate:iso(-14),deadline:iso(3),priority:'high',city:'杭州',note:'笔试待考'},
    {id:'f4',company:'某某邮储银行 浙江省分行',position:'U 生代管培',link:'',cat:'finance',
     status:'gaveup',applyDate:iso(-22),deadline:'',priority:'low',city:'杭州',note:'与其他 offer 冲突'},
    {id:'s1',company:'某某城市建设投资集团',position:'数据信息类 管培生',link:'',cat:'soe',
     status:'written',applyDate:iso(-13),deadline:iso(0),priority:'high',city:'杭州',note:'今天笔试'},
    {id:'s2',company:'某某资本集团',position:'产业投资',link:'',cat:'soe',
     status:'applied',applyDate:iso(-12),deadline:iso(8),priority:'mid',city:'杭州',note:'智联投递'},
    {id:'s3',company:'某某机场集团',position:'信息科技类',link:'',cat:'soe',
     status:'applied',applyDate:iso(-10),deadline:iso(14),priority:'mid',city:'南京',note:'邮箱投递'},
    {id:'s4',company:'某某航集团 信息管理部',position:'软件开发 / 产品管理',link:'',cat:'soe',
     status:'applied',applyDate:iso(-9),deadline:iso(11),priority:'high',city:'杭州',note:''},
    {id:'s5',company:'某某国有资本运营公司',position:'数字化监管管培生',link:'',cat:'soe',
     status:'rejected',applyDate:iso(-26),deadline:'',priority:'mid',city:'杭州',note:'未通过初筛'},
    {id:'n1',company:'某某跳动',position:'AI 产品运营',link:'',cat:'internet',
     status:'interview',applyDate:iso(-10),deadline:iso(2),priority:'high',city:'深圳',note:'已过三面，等 HR 面'},
    {id:'n2',company:'某某互娱',position:'游戏产品策划',link:'',cat:'internet',
     status:'written',applyDate:iso(-15),deadline:iso(5),priority:'high',city:'深圳',note:'笔试通知已到'},
    {id:'n3',company:'某某点评',position:'数据分析师',link:'',cat:'internet',
     status:'offer',applyDate:iso(-24),deadline:'',priority:'high',city:'上海',note:'Offer 已签'},
    {id:'n4',company:'某某出行',position:'产品经理',link:'',cat:'internet',
     status:'applied',applyDate:iso(-7),deadline:iso(4),priority:'mid',city:'杭州',note:''},
    {id:'n5',company:'某某搜索',position:'前端工程师',link:'',cat:'internet',
     status:'rejected',applyDate:iso(-28),deadline:'',priority:'low',city:'北京',note:'笔试未通过'}
  ];

  var data,view='table',flt='all',fltSt='',sortK='deadline',sortA=true,editId=null,tid=null,dragId=null;
  var $=function(i){return document.getElementById(i)};

  function load(){
    try{var s=localStorage.getItem(KEY);
      if(s){var p=JSON.parse(s);if(Array.isArray(p)){data=p;return}}}catch(e){}
    data=JSON.parse(JSON.stringify(SEED));
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){show('保存失败',1)}}
  function show(m,w){var t=$('tst');t.textContent=m;t.className='tst on'+(w?' w':'');
    clearTimeout(tid);tid=setTimeout(function(){t.className='tst'},1700)}

  function shown(){
    var s=$('q').value.trim().toLowerCase();
    return data.filter(function(d){
      if(fltSt && d.status!==fltSt) return false;
      if(s){
        var hay=(d.company+' '+d.position+' '+(d.note||'')+' '+(d.city||'')).toLowerCase();
        if(hay.indexOf(s)<0)return false;
      }
      if(flt==='live') return !DEAD[d.status]&&d.status!=='offer';
      if(flt==='offer') return d.status==='offer';
      if(flt==='urgent'){
        if(DEAD[d.status]||d.status==='offer'||!d.deadline)return false;
        var n=ds(d.deadline);return n>=0&&n<=7;
      }
      if(CATS.some(function(c){return c.k===flt})) return d.cat===flt;
      return true;
    });
  }

  function render(){renderUrg();renderStat();renderView()}

  function renderUrg(){
    var l=data.filter(function(d){return !DEAD[d.status]&&d.status!=='offer'&&d.deadline})
      .map(function(d){return{d:d,n:ds(d.deadline)}})
      .filter(function(x){return x.n>=0&&x.n<=3}).sort(function(a,b){return a.n-b.n});
    var e=$('urg');
    if(!l.length){e.className='urg hide';e.innerHTML='';return}
    e.className='urg';
    e.innerHTML='<span class="lb">⚠ 紧急</span>'+l.map(function(x){
      var t=x.n===0?'今天截止':(x.n===1?'还剩 1 天':'还剩 '+x.n+' 天');
      return '<span class="it" data-id="'+x.d.id+'"><b>'+esc(x.d.company)+'</b> '+t+'</span>';
    }).join('');
  }

  function renderStat(){
    var n=data.length,c={};
    STS.forEach(function(s){c[s.k]=0});
    data.forEach(function(d){if(c[d.status]!=null)c[d.status]++});
    var rate=n?Math.round((c.interview+c.offer)/n*100):0;
    var soon=data.filter(function(d){
      if(DEAD[d.status]||d.status==='offer'||!d.deadline)return false;
      var k=ds(d.deadline);return k>=0&&k<=7}).length;
    $('kpi').innerHTML=[[n,'总投递'],[rate+'%','面试转化'],[c.offer,'Offer','g'],[soon,'7日内截止','r']]
      .map(function(x){return '<div class="kp'+(x[2]?' '+x[2]:'')+'"><div class="n">'+x[0]+
        '</div><div class="l">'+x[1]+'</div></div>'}).join('');
    $('cntTip').textContent=n+' 条投递';

    $('byc').innerHTML=CATS.map(function(ct){
      var it=data.filter(function(d){return d.cat===ct.k});
      if(!it.length&&ct.k==='other')return '';
      var live=it.filter(function(d){return !DEAD[d.status]&&d.status!=='offer'}).length;
      var off=it.filter(function(d){return d.status==='offer'}).length;
      return '<div class="cc'+(flt===ct.k?' on':'')+'" data-cat="'+ct.k+'" style="'+
        (flt===ct.k?'border-color:'+ct.c+';background:'+ct.c+'0d':'')+'">'+
        '<div class="cn"><i style="background:'+ct.c+'"></i>'+ct.n+'</div>'+
        '<div class="cv" style="color:'+ct.c+'">'+it.length+'</div>'+
        '<div class="cs">进行 '+live+(off?' · Offer '+off:'')+'</div></div>';
    }).join('');

    var mx=Math.max.apply(null,STS.map(function(s){return c[s.k]}).concat([1]));
    $('fnl').innerHTML=STS.map(function(s){
      return '<div class="fr"><span class="fl">'+s.n+'</span><span class="fb"><i style="width:'+
        (c[s.k]/mx*100)+'%;background:'+s.c+'"></i></span><span class="fv">'+c[s.k]+'</span></div>';
    }).join('');
  }

  function renderView(){
    var list=shown();
    if(!list.length){
      $('view').innerHTML='<div class="tbw"><div class="non">没有符合条件的投递<br><br>'+
        '<button class="bt" data-a="clr">清除筛选</button></div></div>';
      return;
    }
    $('view').innerHTML=view==='table'?tableHtml(list):boardHtml(list);
  }

  var COLDEF=[
    {k:'company', n:'企业'},
    {k:'cat',     n:'性质'},
    {k:'position',n:'投递岗位'},
    {k:'priority',n:'优先级'},
    {k:'status',  n:'状态'},
    {k:'city',    n:'所在地'},
    {k:'applyDate',n:'投递时间'},
    {k:'deadline',n:'下个节点'},
    {k:'link',    n:'链接',na:1},
    {k:'note',    n:'备注',na:1},
    {k:'ops',     n:'',na:1}
  ];

  function sortList(l){
    var c=sortA?1:-1;
    return l.slice().sort(function(a,b){
      var x,y;
      if(sortK==='priority'){x=PW[a.priority]||0;y=PW[b.priority]||0;return (y-x)*c}
      if(sortK==='status'){
        x=STS.map(function(s){return s.k}).indexOf(a.status);
        y=STS.map(function(s){return s.k}).indexOf(b.status);return (x-y)*c}
      if(sortK==='cat'){
        x=CATS.map(function(s){return s.k}).indexOf(a.cat);
        y=CATS.map(function(s){return s.k}).indexOf(b.cat);return (x-y)*c}
      if(sortK==='deadline'){
        x=a.deadline?ds(a.deadline):99999;y=b.deadline?ds(b.deadline):99999;
        if(DEAD[a.status])x=99999;if(DEAD[b.status])y=99999;
        return (x-y)*c}
      x=String(a[sortK]||'');y=String(b[sortK]||'');
      return x.localeCompare(y,'zh')*c;
    });
  }

  function tableHtml(list){
    var head='<tr>'+COLDEF.map(function(cd){
      var ar=sortK===cd.k?'<span class="ar">'+(sortA?'↑':'↓')+'</span>':'';
      return '<th'+(cd.na?' class="na"':' data-sk="'+cd.k+'"')+'>'+cd.n+ar+'</th>';
    }).join('')+'</tr>';

    var body='';
    CATS.forEach(function(ct){
      var it=sortList(list.filter(function(d){return d.cat===ct.k}));
      if(!it.length)return;
      var live=it.filter(function(d){return !DEAD[d.status]&&d.status!=='offer'}).length;
      body+='<tr class="gh"><td colspan="'+COLDEF.length+'"><div class="gi">'+
        '<i style="background:'+ct.c+'"></i>'+ct.n+
        ' <span class="gn">'+it.length+' 条 · 进行中 '+live+'</span></div></td></tr>';
      body+=it.map(rowHtml).join('');
    });
    return '<div class="tbw"><div class="tbs"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  }

  function dlCell(d){
    if(DEAD[d.status])return '<span class="dl p">'+(d.deadline?fmt(d.deadline):'—')+'</span>';
    if(!d.deadline)return '<span class="dt">—</span>';
    var n=ds(d.deadline),c='',t=fmt(d.deadline);
    if(n<0){c='p';t+=' 已过';}
    else if(n===0){c='h';t+=' 今天';}
    else if(n===1){c='h';t+=' 明天';}
    else if(n<=3){c='h';t+=' '+n+'天';}
    else if(n<=7){c='w';t+=' '+n+'天';}
    else t+=' '+n+'天';
    return '<span class="dl '+c+'">'+t+'</span>';
  }

  function rowHtml(d){
    var n=d.deadline&&!DEAD[d.status]?ds(d.deadline):null;
    var hot=n!=null&&n>=0&&n<=3&&d.status!=='offer';
    var ct=CATS.filter(function(c){return c.k===d.cat})[0]||CATS[3];
    return '<tr data-id="'+d.id+'" class="'+(hot?'hot':'')+(DEAD[d.status]?' dim':'')+'">'
      +'<td><span class="co">'+esc(d.company)+'</span></td>'
      +'<td><span class="tag '+ct.cls+'">'+ct.n+'</span></td>'
      +'<td><span class="po">'+esc(d.position)+'</span></td>'
      +'<td><span class="pr p-'+d.priority+'">'+nm(PRS,d.priority)+'</span></td>'
      +'<td><select class="sel st s-'+d.status+'" data-a="qs">'+STS.map(function(s){
          return '<option value="'+s.k+'"'+(d.status===s.k?' selected':'')+'>'+s.n+'</option>'}).join('')
        +'</select></td>'
      +'<td><span class="dt">'+esc(d.city||'—')+'</span></td>'
      +'<td><span class="dt">'+fmt(d.applyDate)+'</span></td>'
      +'<td>'+dlCell(d)+'</td>'
      +'<td>'+(d.link?'<a class="lk" href="'+esc(d.link)+'" target="_blank" rel="noopener" data-a="link">打开 ↗</a>':'<span class="dt">—</span>')+'</td>'
      +'<td><span class="nt" title="'+esc(d.note)+'">'+esc(d.note||'—')+'</span></td>'
      +'<td><span class="ops"><button class="ic" data-a="edit" title="修改">✎</button>'
      +'<button class="ic d" data-a="del" title="删除">✕</button></span></td></tr>';
  }

  function boardHtml(list){
    return '<div class="bd">'+STS.map(function(s){
      var it=sortList(list.filter(function(d){return d.status===s.k}));
      return '<div class="col" data-s="'+s.k+'"><div class="ch"><span>'+s.n+
        '</span><span class="cnt">'+it.length+'</span></div><div class="cb">'+
        (it.length?it.map(cardHtml).join(''):'<div class="ept">拖到这里</div>')+'</div></div>';
    }).join('')+'</div>';
  }

  function cardHtml(d){
    var n=d.deadline&&!DEAD[d.status]?ds(d.deadline):null;
    var ct=CATS.filter(function(c){return c.k===d.cat})[0]||CATS[3];
    return '<div class="cd'+(n!=null&&n>=0&&n<=3?' hot':'')+'" draggable="true" data-id="'+d.id+'">'
      +'<span class="ops"><button class="ic" data-a="edit">✎</button>'
      +'<button class="ic d" data-a="del">✕</button></span>'
      +'<div class="cdc">'+esc(d.company)+'</div>'
      +'<div class="cdp">'+esc(d.position)+'</div>'
      +'<div class="cdm"><span class="tag '+ct.cls+'">'+ct.n+'</span>'
      +'<span class="pr p-'+d.priority+'">'+nm(PRS,d.priority)+'</span>'
      +(n!=null?'<span class="dl '+(n<=3?'h':(n<=7?'w':''))+'">'+
        (n===0?'今天':(n<0?'已过期':n+'天后'))+'</span>':'')
      +'</div></div>';
  }

  function openDlg(id){
    editId=id||null;
    var d=id?data.filter(function(x){return x.id===id})[0]:
      {company:'',position:'',link:'',cat:'internet',status:'applied',
       applyDate:iso(0),deadline:'',priority:'mid',city:'',note:''};
    var m=document.createElement('div');
    m.className='mask';m.id='mask';
    m.innerHTML='<div class="dlg"><h3>'+(id?'修改投递':'新增投递')+'</h3>'
      +'<div class="fg2"><div class="fg"><label>企业名称 <i>*</i></label>'
        +'<input id="iCo" value="'+esc(d.company)+'" placeholder="例如：某某银行 浙江省分行"></div>'
      +'<div class="fg"><label>投递岗位 <i>*</i></label>'
        +'<input id="iPo" value="'+esc(d.position)+'" placeholder="例如：金融科技岗"></div></div>'
      +'<div class="err" id="eMsg"></div>'
      +'<div class="fg3"><div class="fg"><label>企业性质</label><select id="iCa">'
        +CATS.map(function(c){return '<option value="'+c.k+'"'+(d.cat===c.k?' selected':'')+'>'+c.n+'</option>'}).join('')
        +'</select></div>'
      +'<div class="fg"><label>当前状态</label><select id="iSt">'
        +STS.map(function(s){return '<option value="'+s.k+'"'+(d.status===s.k?' selected':'')+'>'+s.n+'</option>'}).join('')
        +'</select></div>'
      +'<div class="fg"><label>优先级</label><select id="iPr">'
        +PRS.map(function(p){return '<option value="'+p.k+'"'+(d.priority===p.k?' selected':'')+'>'+p.n+'</option>'}).join('')
        +'</select></div></div>'
      +'<div class="fg3"><div class="fg"><label>所在地</label>'
        +'<input id="iCi" value="'+esc(d.city)+'" placeholder="杭州"></div>'
      +'<div class="fg"><label>投递时间</label><input type="date" id="iAp" value="'+esc(d.applyDate)+'"></div>'
      +'<div class="fg"><label>下个节点 / 截止</label><input type="date" id="iDl" value="'+esc(d.deadline)+'"></div></div>'
      +'<div class="fg"><label>投递网站 / 链接</label>'
        +'<input id="iLk" value="'+esc(d.link)+'" placeholder="https://…"></div>'
      +'<div class="fg"><label>备注</label>'
        +'<textarea id="iNt" placeholder="进度、内推人、面试反馈…">'+esc(d.note)+'</textarea></div>'
      +'<div class="row"><button class="bt pri" id="bOk">保存</button>'
        +'<button class="bt" id="bCa">取消</button>'
        +(id?'<button class="bt" id="bDel" style="color:var(--rd)">删除</button>':'')
        +'<span class="hint">Cmd+Enter 保存 · Esc 关闭</span></div></div>';
    document.body.appendChild(m);
    $('iCo').focus();
    m.addEventListener('click',function(e){
      if(e.target===m)return close();
      var b=e.target.closest('button');if(!b)return;
      if(b.id==='bCa')close();
      if(b.id==='bOk')commit();
      if(b.id==='bDel'&&confirm('删除「'+d.company+'」？')){
        data=data.filter(function(x){return x.id!==id});save();close();render();show('已删除')}
    });
    m.addEventListener('keydown',function(e){
      if(e.key==='Escape')close();
      if((e.metaKey||e.ctrlKey)&&e.key==='Enter')commit();
    });
  }
  function close(){var m=$('mask');if(m)m.remove();editId=null}

  function commit(){
    var co=$('iCo').value.trim(),po=$('iPo').value.trim();
    if(!co||!po){var e=$('eMsg');e.textContent='企业名称和投递岗位都要填';
      e.className='err on';(co?$('iPo'):$('iCo')).focus();return}
    var o={company:co,position:po,link:$('iLk').value.trim(),cat:$('iCa').value,
      status:$('iSt').value,applyDate:$('iAp').value,deadline:$('iDl').value,
      priority:$('iPr').value,city:$('iCi').value.trim(),note:$('iNt').value.trim()};
    if(editId){o.id=editId;
      data[data.findIndex(function(x){return x.id===editId})]=o;show('已更新：'+co)}
    else{o.id='j'+Date.now();data.push(o);show('已添加：'+co)}
    save();close();render();
  }

  document.addEventListener('change',function(e){
    var s=e.target.closest('[data-a=qs]');if(!s)return;
    var id=s.closest('tr').dataset.id;
    var d=data.filter(function(x){return x.id===id})[0];
    d.status=s.value;save();render();show(d.company+' → '+nm(STS,s.value));
  });

  document.addEventListener('click',function(e){
    if(e.target.closest('#mask'))return;
    if(e.target.closest('[data-a=link]'))return;
    if(e.target.closest('[data-a=qs]'))return;

    if(e.target.closest('[data-a=clr]')){
      flt='all';fltSt='';$('q').value='';$('qSt').value='';
      [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){
        c.classList.toggle('on',c.dataset.f==='all')});
      render();return;
    }
    var it=e.target.closest('.urg .it');
    if(it)return openDlg(it.dataset.id);

    var th=e.target.closest('th[data-sk]');
    if(th){
      var k=th.dataset.sk;
      if(sortK===k)sortA=!sortA;else{sortK=k;sortA=true}
      renderView();return;
    }
    var cc=e.target.closest('.cc');
    if(cc){
      flt=flt===cc.dataset.cat?'all':cc.dataset.cat;
      [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){
        c.classList.toggle('on',flt==='all'&&c.dataset.f==='all')});
      render();return;
    }
    var ch=e.target.closest('.chip');
    if(ch){
      flt=ch.dataset.f;
      [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){
        c.classList.toggle('on',c===ch)});
      render();return;
    }
    var b=e.target.closest('button[data-a]');
    if(b){
      var host=b.closest('[data-id]');if(!host)return;
      var id=host.dataset.id;
      if(b.dataset.a==='edit')return openDlg(id);
      if(b.dataset.a==='del'){
        var d=data.filter(function(x){return x.id===id})[0];
        if(confirm('删除「'+d.company+' · '+d.position+'」？')){
          data=data.filter(function(x){return x.id!==id});save();render();show('已删除：'+d.company)}
      }
      return;
    }
    var host2=e.target.closest('tr[data-id],.cd[data-id]');
    if(host2)openDlg(host2.dataset.id);
  });

  document.addEventListener('dragstart',function(e){
    var cd=e.target.closest('.cd');if(!cd)return;
    dragId=cd.dataset.id;cd.classList.add('dragging');
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}
  });
  document.addEventListener('dragend',function(e){
    var cd=e.target.closest('.cd');if(cd)cd.classList.remove('dragging');
    [].slice.call(document.querySelectorAll('.col')).forEach(function(c){c.classList.remove('over')});
    dragId=null;
  });
  document.addEventListener('dragover',function(e){
    var col=e.target.closest('.col');if(!col||!dragId)return;
    e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';
    [].slice.call(document.querySelectorAll('.col')).forEach(function(c){
      c.classList.toggle('over',c===col)});
  });
  document.addEventListener('drop',function(e){
    var col=e.target.closest('.col');if(!col)return;
    e.preventDefault();
    var id=dragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));
    if(!id)return;
    var d=data.filter(function(x){return x.id===id})[0];
    if(d&&d.status!==col.dataset.s){
      d.status=col.dataset.s;save();show(d.company+' → '+nm(STS,col.dataset.s));
    }
    dragId=null;render();
  });

  $('q').addEventListener('input',function(){renderView()});
  $('qSt').addEventListener('change',function(){fltSt=this.value;renderView()});
  $('bNew').addEventListener('click',function(){openDlg()});
  $('vTable').addEventListener('click',function(){
    view='table';this.classList.add('on');$('vBoard').classList.remove('on');renderView()});
  $('vBoard').addEventListener('click',function(){
    view='board';this.classList.add('on');$('vTable').classList.remove('on');renderView()});
  $('bExp').addEventListener('click',function(){
    var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='秋招投递_'+iso(0)+'.json';a.click();
    URL.revokeObjectURL(a.href);show('已导出 '+data.length+' 条');
  });
  $('bImp').addEventListener('click',function(){$('fImp').click()});
  $('fImp').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var p=JSON.parse(r.result);
        if(!Array.isArray(p))throw 0;
        p.forEach(function(x){if(!x.company||!x.status)throw 0});
        data=p;save();render();show('已导入 '+p.length+' 条');
      }catch(err){show('导入失败：不是有效数据',1)}
    };
    r.readAsText(f);e.target.value='';
  });

  document.querySelector('.chip[data-f=all]').classList.add('on');
  load();render();
})();
</script>
</body>
</html>
